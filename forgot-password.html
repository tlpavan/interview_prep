<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password - InterviewPrep AI</title>
  <link rel="stylesheet" href="css/style-creative.css">
  <link rel="stylesheet" href="css/dashboard-flocareer.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@motionone/stable/dist/index.umd.js"></script>
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      position: relative;
    }

    #particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .auth-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
      max-width: 800px;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    @media (min-width: 768px) {
      .auth-layout {
        grid-template-columns: 1fr 1fr;
      }
    }

    .auth-panel {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .panel-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 0.5rem;
    }

    .panel-subtitle {
      color: #64748b;
      margin-bottom: 1.5rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
      color: #374151;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 1rem;
      transition: all 0.2s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    .form-hint {
      font-size: 0.85rem;
      color: #64748b;
      margin-top: 0.5rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: 10px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
      cursor: pointer;
      border: none;
      font-size: 1rem;
      width: 100%;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
    }

    .btn-primary:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #f1f5f9;
      color: #475569;
    }

    .btn-secondary:hover {
      background: #e2e8f0;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: #667eea;
      text-decoration: none;
      font-weight: 500;
      margin-top: 1.5rem;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .success-message {
      background: #d1fae5;
      border: 2px solid #10b981;
      color: #065f46;
      padding: 1rem;
      border-radius: 10px;
      margin-top: 1rem;
    }

    .error-message {
      background: #fee2e2;
      border: 2px solid #ef4444;
      color: #991b1b;
      padding: 1rem;
      border-radius: 10px;
      margin-top: 1rem;
    }

    .password-strength {
      margin-top: 0.5rem;
      font-size: 0.85rem;
    }

    .strength-weak { color: #ef4444; }
    .strength-medium { color: #f59e0b; }
    .strength-strong { color: #10b981; }

    /* Particle background */
    .particle {
      position: absolute;
      background: radial-gradient(circle, rgba(102, 126, 234, 0.6) 0%, transparent 70%);
      border-radius: 50%;
      animation: float 15s infinite ease-in-out;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.3; }
      50% { transform: translate(50px, -100px) scale(1.2); opacity: 0.7; }
    }
  </style>
</head>
<body class="auth-page">
  <div id="particles"></div>

  <div class="auth-layout">
    <div class="auth-panel">
      <h1 class="panel-title">🔑 Reset Password</h1>
      <p class="panel-subtitle">Enter your email and we'll send you a reset link</p>

      <form id="reset-form">
        <div class="form-group">
          <label for="resetEmail">Email Address</label>
          <input
            type="email"
            id="resetEmail"
            name="email"
            placeholder="you@company.com"
            required
            autocomplete="email"
          />
          <div class="form-hint">
            Enter the email associated with your account
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
          Send Reset Email
        </button>
      </form>

      <div id="message" style="display: none;"></div>

      <a href="/index.html" class="back-link">
        <svg viewBox="0 0 24 24" width="20" height="20">
          <path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
        </svg>
        Back to Login
      </a>
    </div>
  </div>

  <script type="module">
    // Create floating particles
    const particlesContainer = document.getElementById('particles');
    const particleCount = 15;
    const colors = [
      'rgba(102, 126, 234, 0.6)',
      'rgba(118, 75, 162, 0.6)',
      'rgba(240, 147, 251, 0.6)'
    ];

    for (let i = 0; i < particleCount; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      const size = Math.random() * 50 + 20;
      particle.style.width = size + 'px';
      particle.style.height = size + 'px';
      particle.style.left = Math.random() * 100 + '%';
      particle.style.top = Math.random() * 100 + '%';
      particle.style.background = `radial-gradient(circle, ${colors[Math.floor(Math.random() * colors.length)]} 0%, transparent 70%)`;
      particle.style.animationDelay = Math.random() * 10 + 's';
      particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
      particlesContainer.appendChild(particle);
    }

    // Firebase configuration (same as firebase.js)
    import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAih8lHfInqCjiTr1QYOJsiPy0y459t72E",
      authDomain: "interview-prep-ai-3e040.firebaseapp.com",
      projectId: "interview-prep-ai-3e040",
      storageBucket: "interview-prep-ai-3e040.appspot.com",
      messagingSenderId: "191805048330",
      appId: "1:191805048330:web:22264e9637b8bd8228c1f3"
    };

    // Initialize Firebase
    const auth = getAuth(firebaseConfig);

    // Form handling
    const form = document.getElementById('reset-form');
    const messageDiv = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('resetEmail').value.trim();

      if (!email) {
        showMessage('Please enter your email address.', 'error');
        return;
      }

      // Validate email format
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        showMessage('Please enter a valid email address.', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = 'Sending...';

      try {
        await sendPasswordResetEmail(auth, email, {
          url: window.location.origin + '/index.html',
          handleCodeInApp: false
        });

        showMessage(
          `Password reset email sent to ${email}. Please check your inbox and follow the instructions.`,
          'success'
        );
        form.reset();
      } catch (error) {
        console.error('Password reset error:', error);

        let errorMessage = 'Failed to send reset email. Please try again.';
        if (error.code === 'auth/user-not-found') {
          errorMessage = 'No account found with this email address.';
        } else if (error.code === 'auth/invalid-email') {
          errorMessage = 'Invalid email address format.';
        } else if (error.code === 'auth/missing-email') {
          errorMessage = 'Please enter your email address.';
        }

        showMessage(errorMessage, 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
          Send Reset Email
        `;
      }
    });

    function showMessage(text, type) {
      messageDiv.textContent = text;
      messageDiv.className = type === 'success' ? 'success-message' : 'error-message';
      messageDiv.style.display = 'block';
      messageDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

      // Auto-hide success after 10 seconds
      if (type === 'success') {
        setTimeout(() => {
          messageDiv.style.display = 'none';
        }, 10000);
      }
    }
  </script>
</body>
</html>
